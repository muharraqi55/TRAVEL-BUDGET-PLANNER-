<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ترتيب ميزانية السفر</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bg1:#1e293b; --bg2:#0b1220;
    --panel:#ffffff; --panel2:#f8fafc;
    --ink:#0f172a; --muted:#64748b;
    --line:#e5e9f0; --line2:#cbd5e1;
    --sky:#0ea5e9; --teal:#14b8a6; --amber:#f59e0b;
    --green:#16a34a; --red:#e11d48; --purple:#8b5cf6;
    --soft:#f8fafc;
    --input-bg:#fffdf5;
    --input-border:#cbd5e1;
    --input-border-hover:#94a3b8;
    --head-grad-1:#0f172a; --head-grad-2:#1e3a5f;
    --row-alt:#ffffff;
  }
  body.dark{
    --bg1:#0b1220; --bg2:#050810;
    --panel:#111827; --panel2:#0f172a;
    --ink:#e5e7eb; --muted:#94a3b8;
    --line:#1f2937; --line2:#334155;
    --soft:#0f172a;
    --input-bg:#1e293b;
    --input-border:#334155;
    --input-border-hover:#475569;
    --head-grad-1:#050810; --head-grad-2:#0f172a;
    --row-alt:#0f172a;
    --sky:#38bdf8; --teal:#2dd4bf; --amber:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, var(--bg1), var(--bg2) 60%);
    color:var(--ink); min-height:100vh; padding:22px 16px 40px;
    font-size:calc(14px * var(--fs,1));
    transition:background .3s, color .3s;
    position:relative;
  }

  /* ============================================================
     شارة حقوق الملكية - الزاوية العلوية
  ============================================================ */
  .copyright-badge{
    position:fixed;
    top:14px;
    inset-inline-start:14px;
    z-index:900;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 14px 8px 12px;
    background:linear-gradient(135deg,rgba(15,23,42,.85),rgba(30,58,95,.85));
    border:1px solid rgba(255,255,255,.15);
    border-radius:999px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.05) inset;
    text-decoration:none;
    transition:.25s;
    cursor:default;
  }
  .copyright-badge:hover{
    transform:translateY(-1px);
    box-shadow:0 12px 30px rgba(0,0,0,.45), 0 0 20px rgba(14,165,233,.2);
    border-color:rgba(14,165,233,.4);
  }
  .copyright-badge .cb-icon{
    width:22px;height:22px;
    border-radius:50%;
    background:linear-gradient(135deg,#0ea5e9,#14b8a6);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:11px;font-weight:900;
    box-shadow:0 0 12px rgba(14,165,233,.5);
  }
  .copyright-badge .cb-text{
    display:flex;flex-direction:column;line-height:1.1;
  }
  .copyright-badge .cb-text small{
    font-size:9px;color:#94a3b8;
    letter-spacing:1px;font-weight:700;text-transform:uppercase;
  }
  .copyright-badge .cb-text strong{
    font-size:13px;
    background:linear-gradient(135deg,#7dd3fc,#5eead4 50%,#a78bfa);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    font-weight:900;
    letter-spacing:.5px;
  }
  body.dark .copyright-badge{
    background:linear-gradient(135deg,rgba(5,8,16,.9),rgba(15,23,42,.9));
  }
  @media(max-width:640px){
    .copyright-badge{
      top:10px; inset-inline-start:10px;
      padding:6px 10px 6px 9px;
    }
    .copyright-badge .cb-text strong{font-size:11px}
    .copyright-badge .cb-icon{width:18px;height:18px;font-size:10px}
  }

  /* ============================================================
     تذييل حقوق الملكية - أسفل الصفحة
  ============================================================ */
  .site-footer{
    max-width:1500px;
    margin:48px auto 0;
    padding:24px 20px;
    text-align:center;
    position:relative;
  }
  .site-footer::before{
    content:"";
    position:absolute;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:120px;
    height:3px;
    border-radius:3px;
    background:linear-gradient(90deg,transparent,#0ea5e9,#14b8a6,#8b5cf6,transparent);
    opacity:.7;
  }
  .footer-inner{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    padding:18px 40px;
    background:linear-gradient(135deg,rgba(15,23,42,.6),rgba(30,58,95,.5));
    border:1px solid rgba(255,255,255,.12);
    border-radius:20px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 20px 45px rgba(2,6,23,.4);
    position:relative;
    overflow:hidden;
  }
  .footer-inner::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:20px;
    background:linear-gradient(135deg,#0ea5e9,#14b8a6,#8b5cf6,#0ea5e9);
    background-size:300% 300%;
    animation:gradientShift 8s ease infinite;
    z-index:-1;
    opacity:.35;
    filter:blur(12px);
  }
  @keyframes gradientShift{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }
  .footer-logo{
    width:56px;height:56px;
    border-radius:16px;
    background:linear-gradient(135deg,#0ea5e9,#14b8a6 50%,#8b5cf6);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:900;
    color:#fff;
    box-shadow:0 10px 30px rgba(14,165,233,.45), inset 0 1px 0 rgba(255,255,255,.3);
    letter-spacing:-1px;
    position:relative;
  }
  .footer-logo::after{
    content:"";
    position:absolute;inset:-3px;
    border-radius:19px;
    background:linear-gradient(135deg,#0ea5e9,#14b8a6,#8b5cf6);
    z-index:-1;
    filter:blur(8px);
    opacity:.6;
  }
  .footer-name{
    font-size:26px;
    font-weight:900;
    letter-spacing:2px;
    background:linear-gradient(135deg,#7dd3fc 0%,#5eead4 35%,#a78bfa 70%,#f0abfc 100%);
    background-size:200% 200%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    animation:gradientShift 6s ease infinite;
    line-height:1.1;
    margin-top:2px;
  }
  .footer-tagline{
    font-size:11.5px;
    color:#94a3b8;
    font-weight:600;
    letter-spacing:2.5px;
    text-transform:uppercase;
    margin-top:1px;
  }
  .footer-divider{
    width:60px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(148,163,184,.4),transparent);
    margin:6px 0 2px;
  }
  .footer-copy{
    font-size:11px;
    color:#64748b;
    font-weight:600;
    display:flex;align-items:center;gap:6px;
    flex-wrap:wrap;justify-content:center;
  }
  .footer-copy .heart{
    color:#e11d48;
    display:inline-block;
    animation:heartbeat 1.6s ease-in-out infinite;
  }
  @keyframes heartbeat{
    0%,100%{transform:scale(1)}
    15%{transform:scale(1.2)}
    30%{transform:scale(1)}
    45%{transform:scale(1.15)}
  }
  .footer-year{
    padding:1px 8px;
    background:rgba(255,255,255,.08);
    border-radius:6px;
    border:1px solid rgba(255,255,255,.1);
    font-weight:800;
    color:#cbd5e1;
    font-size:10.5px;
  }
  body.dark .footer-inner{
    background:linear-gradient(135deg,rgba(5,8,16,.7),rgba(15,23,42,.6));
  }
  @media(max-width:640px){
    .footer-inner{padding:14px 24px}
    .footer-logo{width:46px;height:46px;font-size:18px;border-radius:13px}
    .footer-name{font-size:20px;letter-spacing:1.5px}
    .footer-tagline{font-size:10px;letter-spacing:2px}
  }

  /* باقي التنسيقات كما هي */
  .page-head{max-width:1500px;margin:0 auto 14px;text-align:center;color:#e2e8f0}
  .page-head h1{margin:0 0 4px;font-size:1.75em;letter-spacing:.2px}
  .page-head p{margin:0;color:#94a3b8;font-size:.95em}

  .toolbar{
    max-width:1500px;margin:0 auto 18px;
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:10px 12px;
    backdrop-filter:blur(8px);
  }
  .tb-btn{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    color:#e2e8f0;font-family:inherit;font-weight:700;font-size:.85em;
    padding:7px 12px;border-radius:9px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:.15s;white-space:nowrap;
  }
  .tb-btn:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
  .tb-btn:active{transform:translateY(0)}
  .tb-btn:disabled{opacity:.5;cursor:wait}
  .tb-btn.primary{background:linear-gradient(135deg,#0ea5e9,#14b8a6);border-color:transparent}
  .tb-btn.primary:hover{filter:brightness(1.08)}
  .tb-btn.rates-btn{background:linear-gradient(135deg,#8b5cf6,#6366f1);border-color:transparent}
  .tb-btn.rates-btn:hover{filter:brightness(1.08)}
  .tb-sep{width:1px;height:22px;background:rgba(255,255,255,.15);margin:0 4px}

  .rates-status{
    font-size:.78em;color:#94a3b8;font-weight:600;
    display:flex;align-items:center;gap:6px;
  }
  .rates-status .dot{
    width:8px;height:8px;border-radius:50%;
    background:#64748b;display:inline-block;
  }
  .rates-status.ok .dot{background:#4ade80;box-shadow:0 0 8px #4ade80}
  .rates-status.err .dot{background:#e11d48}

  .titles-panel{
    max-width:1500px;margin:0 auto 18px;
    background:var(--panel);border-radius:16px;overflow:hidden;
    box-shadow:0 20px 45px rgba(2,6,23,.45);
    border:1px solid rgba(255,255,255,.06);
  }
  .titles-head{
    background:linear-gradient(135deg,var(--head-grad-1),var(--head-grad-2));
    color:#fff;padding:13px 18px;
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;
  }
  .titles-head h3{margin:0;font-size:1em;display:flex;align-items:center;gap:8px}
  .titles-head .reset-btn{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
    color:#cbd5e1;font-family:inherit;font-size:.8em;padding:6px 12px;
    border-radius:8px;cursor:pointer;transition:.15s;font-weight:600;
  }
  .titles-head .reset-btn:hover{background:rgba(255,255,255,.2);color:#fff}

  .tabs{
    display:flex;background:var(--soft);border-bottom:2px solid var(--line2);
    padding:0 10px;gap:4px;flex-wrap:wrap;
  }
  .tab{
    background:transparent;border:0;font-family:inherit;
    font-size:.9em;font-weight:700;color:var(--muted);
    padding:11px 15px;cursor:pointer;
    display:flex;align-items:center;gap:8px;
    position:relative;top:2px;
    transition:.15s;border-radius:10px 10px 0 0;
  }
  .tab:hover{background:rgba(14,165,233,.08);color:var(--ink)}
  .tab.active{background:var(--panel);color:var(--ink);margin-bottom:-2px;box-shadow:0 -3px 0 0 var(--sky) inset}
  .tab[data-cat="hotel"].active{box-shadow:0 -3px 0 0 var(--teal) inset}
  .tab[data-cat="other"].active{box-shadow:0 -3px 0 0 var(--amber) inset}
  .tab .count{
    background:var(--line);color:var(--muted);
    font-size:.75em;padding:1px 8px;border-radius:999px;
    font-weight:800;min-width:22px;text-align:center;
  }
  .tab.active .count{background:var(--sky);color:#fff}
  .tab[data-cat="hotel"].active .count{background:var(--teal)}
  .tab[data-cat="other"].active .count{background:var(--amber)}

  .tab-body{padding:13px 18px 15px}
  .chip-list{display:flex;flex-wrap:wrap;gap:8px;min-height:36px;margin-bottom:12px}
  .chip-list .empty{color:var(--muted);font-size:.9em;font-style:italic;padding:6px 0}
  .chip{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--soft);border:1px solid var(--line2);
    color:var(--ink);font-size:.85em;font-weight:600;
    padding:5px 8px 5px 13px;border-radius:999px;
  }
  .chip.air{background:#e0f2fe;border-color:#7dd3fc;color:#0369a1}
  .chip.hotel{background:#ccfbf1;border-color:#5eead4;color:#0f766e}
  .chip.other{background:#fef3c7;border-color:#fcd34d;color:#92400e}
  body.dark .chip.air{background:rgba(56,189,248,.15);color:#7dd3fc}
  body.dark .chip.hotel{background:rgba(45,212,191,.15);color:#5eead4}
  body.dark .chip.other{background:rgba(251,191,36,.15);color:#fcd34d}
  .chip button{background:transparent;border:0;color:inherit;cursor:pointer;
    font-size:1.1em;line-height:1;padding:0 3px;border-radius:50%;opacity:.6}
  .chip button:hover{opacity:1;background:rgba(0,0,0,.1)}
  .add-row{display:flex;gap:8px}
  .add-row input{
    flex:1;border:1.5px solid var(--input-border);border-radius:9px;
    padding:8px 12px;font-family:inherit;font-size:.92em;
    background:var(--input-bg);color:var(--ink);
  }
  .add-row input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(14,165,233,.15)}
  .add-row button{
    background:linear-gradient(135deg,#0ea5e9,#14b8a6);border:0;color:#fff;
    font-family:inherit;font-weight:700;font-size:.92em;padding:9px 18px;
    border-radius:9px;cursor:pointer;
  }

  .panels{
    max-width:1500px;margin:0 auto;display:grid;gap:20px;
    grid-template-columns:repeat(auto-fit,minmax(560px,1fr));
  }
  @media(max-width:640px){ .panels{grid-template-columns:1fr} }

  .panel{
    background:var(--panel);border-radius:16px;overflow:hidden;
    box-shadow:0 20px 45px rgba(2,6,23,.45);
    border:1px solid rgba(255,255,255,.06);
    position:relative;
  }
  .panel-head{
    background:linear-gradient(135deg,var(--head-grad-1),var(--head-grad-2));
    color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;
    align-items:center;justify-content:space-between;
  }
  .panel-head h2{margin:0;font-size:1.05em;display:flex;align-items:center;gap:10px}
  .badge{background:rgba(14,165,233,.25);border:1px solid rgba(14,165,233,.5);
    color:#7dd3fc;font-size:.75em;padding:3px 10px;border-radius:999px;font-weight:700}
  .panel-remove{
    background:rgba(225,29,72,.2);border:1px solid rgba(225,29,72,.4);
    color:#fda4af;font-family:inherit;font-size:.8em;font-weight:700;
    padding:5px 10px;border-radius:8px;cursor:pointer;
    margin-inline-start:auto;
  }
  .panel-remove:hover{background:rgba(225,29,72,.35);color:#fff}

  .head-inputs{display:flex;gap:12px;flex-wrap:wrap}
  .head-inputs label{display:flex;flex-direction:column;font-size:.72em;color:#94a3b8;gap:4px}
  .head-inputs .inp{
    width:110px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    color:#fff;border-radius:8px;padding:6px 9px;font-size:.95em;font-weight:700;
    font-family:inherit;text-align:center;
  }
  .head-inputs .inp:focus{outline:none;border-color:var(--sky);background:rgba(14,165,233,.18)}

  .table-wrap{overflow-x:auto;padding:13px 14px 0}
  table{width:100%;border-collapse:collapse;font-size:.9em;min-width:1280px}
  thead th{
    background:var(--soft);color:var(--muted);font-weight:800;font-size:.76em;
    letter-spacing:.3px;padding:8px 5px;border-bottom:1px solid var(--line2);
    text-align:center;white-space:nowrap;
  }
  thead th:nth-child(3){text-align:right}
  thead th .th-sub{
    display:block;
    font-size:.85em;font-weight:600;color:#94a3b8;
    margin-top:1px;
  }
  thead th.th-cur-in{color:#0369a1}
  thead th.th-cur-out{color:#7c3aed}
  body.dark thead th.th-cur-in{color:#7dd3fc}
  body.dark thead th.th-cur-out{color:#a78bfa}

  tbody td{border-bottom:1px solid var(--line);padding:4px 4px;vertical-align:middle}
  tbody tr{background:var(--row-alt)}
  tbody tr:hover{background:rgba(14,165,233,.05)}
  tbody tr.cat-air td:first-child{border-inline-start:4px solid var(--sky)}
  tbody tr.cat-hotel td:first-child{border-inline-start:4px solid var(--teal)}
  tbody tr.cat-other td:first-child{border-inline-start:4px solid var(--amber)}
  tbody tr.cat-air{background:rgba(14,165,233,.05)}
  tbody tr.cat-hotel{background:rgba(20,184,166,.05)}
  tbody tr.row-new{animation: rowIn .35s ease-out}
  @keyframes rowIn{from{background:rgba(22,163,74,.2); transform:translateY(-6px); opacity:0}
    to{background:transparent; transform:translateY(0); opacity:1}}
  tbody tr.row-removing{animation: rowOut .28s ease-in forwards}
  @keyframes rowOut{to{opacity:0; transform:translateX(40px); max-height:0}}

  tbody tr.row-off{opacity:.55}
  tbody tr.row-off td:first-child{border-inline-start:4px solid #cbd5e1 !important}
  tbody tr.row-off .cell-inp,
  tbody tr.row-off .cell-total,
  tbody tr.row-off .bhd-cell,
  tbody tr.row-off .currency-sel{
    text-decoration: line-through;text-decoration-color:#cbd5e1;color:#94a3b8;
  }

  .empty-state{text-align:center;padding:30px 20px;color:var(--muted)}
  .empty-state .icon{font-size:2.5em;margin-bottom:8px;opacity:.5}
  .empty-state .txt{font-size:.95em;font-weight:600;color:var(--muted);margin-bottom:4px}
  .empty-state .sub{font-size:.82em}

  .cell-inp{
    width:100%;border:1.5px solid var(--input-border);background:var(--input-bg);
    border-radius:8px;padding:7px 6px;font-family:inherit;font-size:.9em;color:var(--ink);
    transition: border-color .15s, background .15s, box-shadow .15s;
    box-shadow: inset 0 1px 2px rgba(15,23,42,.04);
  }
  .cell-inp::placeholder{color:#94a3b8;font-weight:400}
  .cell-inp:hover{border-color:var(--input-border-hover)}
  .cell-inp:focus{outline:none;border-color:var(--sky);background:var(--panel);
    box-shadow: 0 0 0 3px rgba(14,165,233,.18)}
  .cell-inp.n{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

  .cell-inp[type="number"]::-webkit-outer-spin-button,
  .cell-inp[type="number"]::-webkit-inner-spin-button,
  .perday-inp::-webkit-outer-spin-button,
  .perday-inp::-webkit-inner-spin-button{
    -webkit-appearance: none;margin: 0;
  }
  .cell-inp[type="number"],
  .perday-inp[type="number"]{
    -moz-appearance: textfield;
  }

  @keyframes clampShake{
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }
  .clamp-shake{
    animation: clampShake .3s;
    border-color: var(--red) !important;
    background: rgba(225,29,72,.1) !important;
  }

  .date-wrap{position:relative;display:flex;align-items:center}
  .date-wrap .cell-inp.date-txt{padding-inline-end:26px;font-variant-numeric:tabular-nums;text-align:center}
  .cal-btn{
    position:absolute;inset-inline-end:2px;top:50%;transform:translateY(-50%);
    background:transparent;border:0;cursor:pointer;
    font-size:.95em;line-height:1;padding:5px 4px;border-radius:6px;
    color:var(--muted);
  }
  .cal-btn:hover{background:#e0f2fe;color:var(--sky)}
  .cal-native{position:absolute;inset-inline-end:2px;top:50%;transform:translateY(-50%);
    width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0;margin:0}

  .toggle-cell{text-align:center}
  .toggle-wrap{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .toggle-wrap input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
  .toggle-track{
    width:36px;height:20px;background:#cbd5e1;border-radius:999px;
    position:relative;transition:background .2s;flex-shrink:0;
  }
  .toggle-track::after{
    content:"";position:absolute;top:2px;left:2px;
    width:16px;height:16px;background:#fff;border-radius:50%;
    transition:transform .2s, left .2s;
    box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .toggle-wrap input:checked + .toggle-track{background:linear-gradient(135deg,#16a34a,#14b8a6)}
  .toggle-wrap input:checked + .toggle-track::after{left:18px}
  .toggle-label{font-size:.68em;font-weight:800;color:#94a3b8;min-width:26px}
  .toggle-wrap input:checked ~ .toggle-label{color:#047857}

function loadRatesFromCache(){
  try {
    const raw = localStorage.getItem(RATES_CACHE_KEY);
    if (!raw) return null;
    const c = JSON.parse(raw);
    if (!c || !c.rates || !c.ts) return null;
    if (Date.now() - c.ts > RATES_TTL_MS) return null;
    return c;
  } catch(e){ return null; }
}
function saveRatesToCache(){
  try {
    localStorage.setItem(RATES_CACHE_KEY, JSON.stringify({
      rates: RATES.rates, lastUpdate: RATES.lastUpdate, ts: Date.now()
    }));
  } catch(e){}
}
async function fetchRatesFromInternet(){
  try {
    const res = await fetch(RATES_API, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || data.result !== 'success' || !data.rates) throw new Error('bad response');
    RATES = {
      base: data.base_code || 'BHD',
      rates: data.rates,
      lastUpdate: data.time_last_update_utc || new Date().toUTCString(),
      source: 'live'
    };
    saveRatesToCache();
    return true;
  } catch(err){
    console.warn('فشل جلب أسعار الصرف:', err);
    return false;
  }
}

function toBHD(amount, code){
  const r = RATES.rates[code];
  if (!isFinite(amount)) return 0;
  if (!r || r === 0) return 0;
  return amount / r;
}
function fromBHD(amountBHD, code){
  const r = RATES.rates[code];
  if (!isFinite(amountBHD)) return 0;
  if (!r) return 0;
  return amountBHD * r;
}
function convert(amount, fromCode, toCode){
  const inBHD = toBHD(amount, fromCode);
  return fromBHD(inBHD, toCode);
}

const TITLE_I18N = {
  'flight':              {ar:'رحلة طيران',            en:'flight'},
  'lunch':               {ar:'غداء',                   en:'lunch'},
  'dinner':              {ar:'عشاء',                   en:'dinner'},
  'transport':           {ar:'مواصلات',                en:'transport'},
  'Laundry':             {ar:'غسيل',                   en:'Laundry'},
  'Sweet & could store': {ar:'حلويات ومشروبات',        en:'Sweet & could store'},
  'Hospital':            {ar:'مستشفى',                 en:'Hospital'},
  'Others':              {ar:'أخرى',                   en:'Others'},
  'hotels':              {ar:'فنادق',                  en:'hotels'}
};
const DEFAULT_TITLE_KEYS = {
  air:   ['flight'],
  hotel: ['hotels'],
  other: ['lunch','dinner','transport','Laundry','Sweet & could store','Hospital','Others']
};

function findKey(str){
  if (!str) return null;
  const s = String(str).trim().toLowerCase();
  for (const [key, tr] of Object.entries(TITLE_I18N)){
    if (key.toLowerCase() === s || tr.ar.toLowerCase() === s || tr.en.toLowerCase() === s) return key;
  }
  return null;
}
function translateStr(str, toLang){
  const key = findKey(str);
  if (key && TITLE_I18N[key]) return TITLE_I18N[key][toLang];
  return str;
}
function getDefaultTitles(lang){
  const out = {air:[], hotel:[], other:[]};
  ['air','hotel','other'].forEach(cat => {
    out[cat] = DEFAULT_TITLE_KEYS[cat].map(k => TITLE_I18N[k] ? TITLE_I18N[k][lang] : k);
  });
  return out;
}

const STORAGE_KEY = 'travel_budget_v11';

function createDefaultPanel(idx){
  return {
    id: 'plan_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    index: idx, days: 14, budget: 0, perdayDays: null, rows: []
  };
}
function createDefaultState(){
  const lang = 'ar';
  return {
    lang, theme: 'light', fontScale: 1,
    titles: getDefaultTitles(lang),
    panels: [createDefaultPanel(0)],
    activeCat: 'air'
  };
}
function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s !== 'object' || !Array.isArray(s.panels)) return null;
    if (!s.titles || typeof s.titles !== 'object') s.titles = getDefaultTitles(s.lang || 'ar');
    ['air','hotel','other'].forEach(c => { if (!Array.isArray(s.titles[c])) s.titles[c] = []; });
    s.panels.forEach((p,i) => {
      if (!p.id) p.id = 'plan_' + Date.now() + '_' + i;
      if (!Array.isArray(p.rows)) p.rows = [];
      if (typeof p.days !== 'number') p.days = 14;
      if (typeof p.budget !== 'number') p.budget = 0;
      if (p.perdayDays === undefined) p.perdayDays = null;
      p.rows.forEach(r => {
        if (!r.currency)  r.currency  = 'BHD';
        if (!r.currency2) r.currency2 = 'BHD';
      });
    });
    if (typeof s.fontScale !== 'number') s.fontScale = 1;
    if (!s.lang) s.lang = 'ar';
    if (!s.theme) s.theme = 'light';
    if (!s.activeCat) s.activeCat = 'air';
    return s;
  } catch(e) { return null; }
}

let STATE = loadState() || createDefaultState();
function t(key){ const d = I18N[STATE.lang] || I18N.ar; return d[key] !== undefined ? d[key] : key; }
function curSym(code){ const c = CURRENCIES[code]; return c ? c.sym : code; }
function curName(code){
  const c = CURRENCIES[code];
  if (!c) return code;
  return STATE.lang === 'ar' ? c.ar : c.en;
}

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmt = n => (isFinite(n) ? n : 0)
  .toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});

const AIR_KEYWORDS   = /flight|طيران|رحلة|طائرة|مطار|airport|hkt|bkk|cnx|cei|dmk|phuket|jet|air/i;
const HOTEL_KEYWORDS = /hotel|hotels|فندق|فنادق|هوتيل|resort|منتجع|hostel|inn|lodge/i;

function categoryOf(title){
  const s = String(title || '').trim().toLowerCase();
  if (!s) return 'other';
  for (const cat of ['air','hotel','other']){
    if (STATE.titles[cat].some(x => x.toLowerCase() === s)) return cat;
  }
  const key = findKey(title);
  if (key){
    for (const cat of ['air','hotel','other']){
      if (STATE.titles[cat].some(x => findKey(x) === key)) return cat;
    }
  }
  if (HOTEL_KEYWORDS.test(s)) return 'hotel';
  if (AIR_KEYWORDS.test(s)) return 'air';
  return 'other';
}

function parseDateForPicker(s){
  s = String(s || '').trim();
  const m = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if (!m) return '';
  const d  = String(+m[1]).padStart(2,'0');
  const mo = String(+m[2]).padStart(2,'0');
  return `${m[3]}-${mo}-${d}`;
}
function formatDateFromPicker(v){
  if (!v) return '';
  const [y,mo,d] = v.split('-');
  return `${+d}/${+mo}/${y}`;
}

function exportData(){
  syncFromDOM();
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const ts = new Date().toISOString().slice(0,10);
  a.download = `travel-budget-${ts}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importData(file){
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data || !Array.isArray(data.panels)) throw new Error('bad');
      STATE = data;
      if (!STATE.titles) STATE.titles = getDefaultTitles(STATE.lang || 'ar');
      ['air','hotel','other'].forEach(c => { if (!Array.isArray(STATE.titles[c])) STATE.titles[c] = []; });
      if (!STATE.lang) STATE.lang = 'ar';
      if (!STATE.theme) STATE.theme = 'light';
      if (typeof STATE.fontScale !== 'number') STATE.fontScale = 1;
      if (!STATE.activeCat) STATE.activeCat = 'air';
      STATE.panels.forEach((p,i) => {
        if (!p.id) p.id = 'plan_' + Date.now() + '_' + i;
        if (!Array.isArray(p.rows)) p.rows = [];
        p.rows.forEach(r => {
          if (!r.currency)  r.currency  = 'BHD';
          if (!r.currency2) r.currency2 = 'BHD';
        });
      });
      applyTheme(); applyFontScale(); applyLang(); renderEverything(); saveState();
      showToast(t('importSuccess'));
    } catch(err) { showToast(t('importError'), true); }
  };
  reader.onerror = () => showToast(t('importError'), true);
  reader.readAsText(file);
}

function updateRatesStatusUI(){
  const el = document.getElementById('ratesStatus');

  if (!el || !txt) return;
  el.classList.remove('ok','err');

  if (RATES.source === 'live'){
    el.classList.add('ok');
    txt.textContent = t('ratesOk');
  } else if (RATES.source === 'cached'){
    el.classList.add('ok');
    txt.textContent = t('ratesCached');
  } else if (RATES.source === 'fallback'){
    txt.textContent = t('ratesFallback');
  } else if (RATES.source === 'error'){
    el.classList.add('err');
    txt.textContent = t('ratesError');
  } else {
    txt.textContent = '…';
  }
}

function renderTitlesUI(){
  const tabsEl = document.getElementById('tabs');
  const chipListEl = document.getElementById('chipList');
  const datalist = document.getElementById('titlesList');

  const labels = { air: t('tabAir'), hotel: t('tabHotel'), other: t('tabOther') };
  const cats = ['air','hotel','other'];

  tabsEl.innerHTML = cats.map(c => `
    <button class="tab ${c === STATE.activeCat ? 'active' : ''}" data-cat="${c}" type="button">
      ${labels[c]} <span class="count">${STATE.titles[c].length}</span>
    </button>
  `).join('');

  const all = [];
  cats.forEach(c => STATE.titles[c].forEach(x => {
    if (!all.some(y => y.toLowerCase() === x.toLowerCase())) all.push(x);
  }));
  datalist.innerHTML = all.map(x => `<option value="${esc(x)}"></option>`).join('');

  const list = STATE.titles[STATE.activeCat];
  if (!list.length){
    chipListEl.innerHTML = `<div class="empty">${t('planEmptyMsg')} «${labels[STATE.activeCat]}»</div>`;
  } else {
    chipListEl.innerHTML = list.map((x,i) =>
      `<span class="chip ${STATE.activeCat}">${esc(x)}<button type="button" data-del="${i}" title="×">×</button></span>`
    ).join('');
  }
  document.getElementById('newTitleInput').placeholder =
    t('addTitleTo') + ' «' + labels[STATE.activeCat] + '»…';
}

  v = String(v||'').trim(); if (!v) return;
  ['air','hotel','other'].forEach(c => {
    STATE.titles[c] = STATE.titles[c].filter(x => x.toLowerCase() !== v.toLowerCase());

}

function buildCurrencyOptions(selected){
  return Object.entries(CURRENCIES).map(([code, c]) => {
    const label = STATE.lang === 'ar'
      ? `${code} — ${c.ar}`
      : `${code} — ${c.en}`;
    return `<option value="${code}" ${code===selected?'selected':''}>${esc(label)}</option>`;
  }).join('');
}

function enforceMax(inp, getMax){
  const clamp = () => {
    const maxV = parseFloat(getMax()) || 0;
    const v = parseFloat(inp.value);
    if (isFinite(v) && maxV > 0 && v > maxV){
      inp.value = maxV;
      inp.classList.add('clamp-shake');
      setTimeout(() => inp.classList.remove('clamp-shake'), 400);
      return true;
    }
    if (isFinite(v) && v < 0) inp.value = 0;
    return false;
  };
  inp.addEventListener('beforeinput', e => {
    if (e.data && /[0-9]/.test(e.data)){
      const cur = inp.value || '';
      const future = cur + e.data;
      const maxV = parseFloat(getMax()) || 0;
      const fv = parseFloat(future);
      if (isFinite(fv) && maxV > 0 && fv > maxV){
        e.preventDefault();
        inp.classList.add('clamp-shake');
        setTimeout(() => inp.classList.remove('clamp-shake'), 400);
      }
    }
  });
  inp.addEventListener('input', clamp);
  inp.addEventListener('change', clamp);
  inp.addEventListener('blur', clamp);
  inp.addEventListener('paste', () => setTimeout(clamp, 0));
}

function doClearRows(tbody, sec, panel){
  Array.from(tbody.children).forEach((tr, i) => {
    setTimeout(() => {
      tr.classList.add('row-removing');
      setTimeout(() => {
        tr.remove(); syncPanelToState(sec); recalcPanel(panel, sec); saveState();
      }, 260);
    }, i * 25);
  });
}
function doRemovePlan(pid){
  STATE.panels = STATE.panels.filter(p => p.id !== pid);
  saveState(); renderPanels();
}
function syncPanelToState(sec){
  const pid = sec.dataset.pid;
  const panel = STATE.panels.find(p => p.id === pid);
  if (!panel) return;
  panel.days   = parseFloat(sec.querySelector('.days-inp').value)   || 0;
  panel.budget = parseFloat(sec.querySelector('.budget-inp').value) || 0;
  const perdayInp = sec.querySelector('.perday-inp');
  panel.perdayDays = perdayInp.dataset.userEdited ? (parseFloat(perdayInp.value) || panel.days) : null;
  panel.rows = [];
  sec.querySelectorAll('tbody tr').forEach(tr => {
    const pv = tr.querySelector('[data-f="price"]').value;
    const dv = tr.querySelector('[data-f="days"]').value;
    const curSel  = tr.querySelector('[data-f="currency"]');
    const cur2Sel = tr.querySelector('[data-f="currency2"]');
    panel.rows.push({
      ok: tr.querySelector('.ok-inp').checked,
      date: tr.querySelector('[data-f="date"]').value,
      title: tr.querySelector('[data-f="title"]').value,
      currency:  curSel  ? curSel.value  : 'BHD',
      currency2: cur2Sel ? cur2Sel.value : 'BHD',
      price: pv === '' ? null : (parseFloat(pv) || 0),
      days:  dv === '' ? null : (parseFloat(dv) || 0)
    });
  });
}
function syncFromDOM(){
  document.querySelectorAll('.panel').forEach(panelEl => syncPanelToState(panelEl));
}

function renderInCurrenciesCard(sec, totals){
  const listEl = sec.querySelector('[data-k="ccListIn"]');
  const updEl  = sec.querySelector('[data-k="ccUpdate"]');
  if (!listEl) return;

  if (updEl){
    if (RATES.lastUpdate){
      const d = new Date(RATES.lastUpdate);
      if (!isNaN(d.getTime())){
        updEl.textContent = t('currenciesCardUpdate') + ' ' + d.toLocaleString(
          STATE.lang === 'ar' ? 'ar-BH' : 'en-GB',
          { dateStyle:'short', timeStyle:'short' }
        );
      } else {
        updEl.textContent = t('currenciesCardUpdate') + ' ' + RATES.lastUpdate;
      }
    } else {
      updEl.textContent = '';
    }
  }

  const codes = Object.keys(totals).sort((a,b) => totals[b].foreign - totals[a].foreign);

  if (!codes.length){
    listEl.innerHTML = `<div class="currencies-empty">${t('currenciesCardEmpty')}</div>`;
    return;
  }

  listEl.innerHTML = codes.map(code => {
    const c = CURRENCIES[code];

    const name = curName(code);
    const foreign = totals[code].foreign;
    const bhd     = totals[code].bhd;
    return `
      <div class="currency-item">
        <div class="ci-left">
          <span class="ci-code in-code">${esc(code)}</span>
          <span class="ci-name">${esc(name)}</span>
        </div>
        <div class="ci-right">
          <span class="ci-sub in-sub">${fmt(foreign)} ${esc(sym)}</span>
          <span class="ci-arrow">→</span>
          <span class="ci-bhd">${fmt(bhd)} ${curSym('BHD')}</span>

      </div>

  }).join('');
}

function recalcPanel(panel, sec){
  const days   = parseFloat(sec.querySelector('.days-inp').value)   || 0;
  const budget = parseFloat(sec.querySelector('.budget-inp').value) || 0;
  sec.querySelector('.badge').textContent = days;

  const perdayInp = sec.querySelector('.perday-inp');
  let perdayDays = parseFloat(perdayInp.value);
  if (!isFinite(perdayDays) || perdayDays <= 0) perdayDays = days;

  let sumTotalBHD = 0, airSum = 0, hotelSum = 0, otherSum = 0;
  let rowCount = 0, offCount = 0;
  const totalsIn  = {};
  const totalsOut = {};

  sec.querySelectorAll('tbody tr').forEach(tr => {
    rowCount++;
    const okInp = tr.querySelector('.ok-inp');
    const isOn  = okInp ? okInp.checked : true;
    tr.classList.toggle('row-off', !isOn);
    if (!isOn) offCount++;

    const titleEl = tr.querySelector('[data-f="title"]');
    const title   = titleEl ? titleEl.value : '';
    const cat     = categoryOf(title);

    tr.classList.remove('cat-air','cat-hotel','cat-other');
    tr.classList.add('cat-' + cat);

    const pill = tr.querySelector('.cat-pill');
    if (pill){
      pill.className = 'cat-pill ' + cat;
      const icons  = {air:'✈️', hotel:'🏨', other:'📦'};
      const labels = {air:t('catAir'), hotel:t('catHotel'), other:t('catOther')};
      pill.textContent = icons[cat] + ' ' + labels[cat];
    }

    const curInSel  = tr.querySelector('[data-f="currency"]');
    const curOutSel = tr.querySelector('[data-f="currency2"]');
    const curIn  = curInSel  ? curInSel.value  : 'BHD';
    const curOut = curOutSel ? curOutSel.value : 'BHD';

    const priceIn = parseFloat(tr.querySelector('[data-f="price"]').value) || 0;
    const d       = parseFloat(tr.querySelector('[data-f="days"]').value)  || 0;

    const equiv = convert(priceIn, curIn, curOut);
    const equivEl = tr.querySelector('[data-k="equiv"]');
    if (equivEl){
      equivEl.textContent = t('approx') + ' ' + fmt(equiv) + ' ' + curSym(curOut);
    }

    const priceInBHD = toBHD(priceIn, curIn);
    const lineBHD    = priceInBHD * d;
    const totEl = tr.querySelector('[data-k="lineBHD"]');
    if (totEl){
      totEl.textContent = fmt(lineBHD) + ' ' + curSym('BHD');
    }

    if (!isOn) return;

    sumTotalBHD += lineBHD;
    if (cat === 'air')   airSum   += lineBHD;
    if (cat === 'hotel') hotelSum += lineBHD;
    if (cat === 'other') otherSum += lineBHD;

    const lineIn = priceIn * d;
    if (!totalsIn[curIn]) totalsIn[curIn] = { foreign:0, bhd:0 };
    totalsIn[curIn].foreign += lineIn;
    totalsIn[curIn].bhd     += lineBHD;

    const lineOut = equiv * d;
    if (!totalsOut[curOut]) totalsOut[curOut] = { foreign:0, bhd:0 };
    totalsOut[curOut].foreign += lineOut;
    totalsOut[curOut].bhd     += lineBHD;
  });

  const airHotel = airSum + hotelSum;
  const hand     = budget - sumTotalBHD;
  const perDay   = perdayDays > 0 ? hand / perdayDays : 0;

  const tfTot = sec.querySelector('.tf-total');
  if (tfTot) tfTot.textContent = fmt(sumTotalBHD) + ' ' + curSym('BHD');
  sec.querySelector('.row-count').textContent = rowCount;

  const offBadge = sec.querySelector('.off-badge');
  if (offBadge){
    offBadge.style.display = offCount > 0 ? 'inline-block' : 'none';
    offBadge.textContent = offCount + ' ' + t('offBadge');
  }
  const emptyState = sec.querySelector('.empty-state');
  if (emptyState) emptyState.style.display = (rowCount === 0) ? 'block' : 'none';

  setStat(sec, 'budget',    budget);
  setStat(sec, 'airOnly',   airSum);
  setStat(sec, 'hotelOnly', hotelSum);
  setStat(sec, 'airHotel',  airHotel);
  setStat(sec, 'otherOnly', otherSum);
  setStat(sec, 'hand',      hand, {bad:true});
  setStat(sec, 'perDay',    perDay, {bad:true});

  renderInCurrenciesCard(sec, totalsIn);
  renderOutCurrenciesCard(sec, totalsOut);
}

function recalcAllPanels(){
  document.querySelectorAll('.panel').forEach(sec => {
    const panel = STATE.panels.find(p => p.id === sec.dataset.pid);
    if (panel) recalcPanel(panel, sec);
  });

function renderPanels(){
  const container = document.getElementById('panels');
  container.innerHTML = '';
  STATE.panels.forEach((p, i) => container.appendChild(buildPanelEl(p, i)));
  document.getElementById('addPlanWrap').style.display = 'flex';
}

function renderEverything(){
  renderTitlesUI();
  renderPanels();
}

function printPlan(panelEl){
  document.querySelectorAll('.panel.print-target').forEach(p => p.classList.remove('print-target'));
  document.body.classList.add('printing');
  panelEl.classList.add('print-target');
  window.print();
}
window.addEventListener('afterprint', () => {
  document.body.classList.remove('printing');
  document.querySelectorAll('.panel.print-target').forEach(p => p.classList.remove('print-target'));
});

async function sharePlanPDF(panelEl, label){
  if (typeof html2pdf === 'undefined'){
    showToast(t('importError'), true);
    return;
  }
  showToast(t('generating'));

  const clone = panelEl.cloneNode(true);
  clone.querySelectorAll('.table-actions, .panel-remove, .cal-btn, .del-btn, .perday-reset').forEach(el => el.remove());

  clone.querySelectorAll('input').forEach(inp => {
    const span = document.createElement('span');
    if (inp.type === 'checkbox') span.textContent = inp.checked ? '✔' : '—';
    else span.textContent = inp.value || '—';
    inp.parentNode.replaceChild(span, inp);
  });
  clone.querySelectorAll('select').forEach(sel => {
    const span = document.createElement('span');
    const opt = sel.options[sel.selectedIndex];
    span.textContent = opt ? opt.textContent : sel.value;
    sel.parentNode.replaceChild(span, sel);
  });
  clone.querySelectorAll('button').forEach(b => b.remove());

  clone.style.position = 'fixed';
  clone.style.left = '-9999px';
  clone.style.top = '0';
  clone.style.width = '1600px';
  clone.style.background = '#ffffff';
  clone.style.color = '#0f172a';
  clone.style.boxShadow = 'none';
  clone.style.borderRadius = '0';

  document.body.appendChild(clone);

  const opt = {
    margin: [8, 8, 8, 8],
    filename: (label || 'plan').replace(/\s+/g,'_') + '_' + new Date().toISOString().slice(0,10) + '.pdf',
    image: { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
  };

  try {
    const blob = await html2pdf().set(opt).from(clone).outputPdf('blob');
    document.body.removeChild(clone);
    const file = new File([blob], opt.filename, { type: 'application/pdf' });

    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try {
        await navigator.share({ files: [file], title: label || 'Travel Budget', text: label || '' });
        showToast(t('shareSuccess'));
      } catch(err){
        if (err && err.name === 'AbortError') showToast(t('shareCancelled'), true);
        else { downloadBlob(blob, opt.filename); showToast(t('shareFallback')); }
      }
    } else {
      downloadBlob(blob, opt.filename);
      showToast(t('shareFallback'));
    }
  } catch(err){
    if (clone.parentNode) document.body.removeChild(clone);
    showToast(t('importError'), true);
  }
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('btnLang').addEventListener('click', () => {
  syncFromDOM();
  STATE.lang = STATE.lang === 'ar' ? 'en' : 'ar';
  retranslateAll(STATE.lang);
  saveState(); applyLang(); renderEverything();
});
document.getElementById('btnFontDec').addEventListener('click', () => {
  STATE.fontScale = Math.max(0.8, +(STATE.fontScale - 0.1).toFixed(2));
  applyFontScale(); saveState();
});
document.getElementById('btnFontInc').addEventListener('click', () => {
  STATE.fontScale = Math.min(1.5, +(STATE.fontScale + 0.1).toFixed(2));
  applyFontScale(); saveState();
});
document.getElementById('btnTheme').addEventListener('click', () => {
  STATE.theme = STATE.theme === 'dark' ? 'light' : 'dark';
  applyTheme(); saveState();
});
document.getElementById('btnSave').addEventListener('click', () => {
  syncFromDOM(); persistAndToast();
});
document.getElementById('btnExport').addEventListener('click', () => exportData());
document.getElementById('btnImport').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) importData(f);
  e.target.value = '';
});

document.getElementById('btnRefreshRates').addEventListener('click', async () => {
  const btn = document.getElementById('btnRefreshRates');
  const statusTxt = document.getElementById('ratesStatusText');
  btn.disabled = true;
  statusTxt.textContent = t('ratesLoading');
  const ok = await fetchRatesFromInternet();
  btn.disabled = false;
  if (ok){
    showToast(t('ratesUpdated'));
    recalcAllPanels();
  } else {
    showToast(t('ratesFailed'), true);
  }
  updateRatesStatusUI();
});

document.getElementById('btnAddPlan').addEventListener('click', () => {
  syncFromDOM();
  STATE.panels.push(createDefaultPanel(STATE.panels.length));
  saveState(); renderPanels();
  setTimeout(() => {
    const panels = document.querySelectorAll('.panel');
    panels[panels.length-1].scrollIntoView({behavior:'smooth', block:'center'});
  }, 100);
});
document.getElementById('resetTitles').addEventListener('click', () => {
  showModal({
    title: t('resetConfirmTitle'),
    message: t('resetConfirmMsg'),
    onSave: () => { exportData(); setTimeout(() => doResetTitles(), 400); },
    onConfirm: () => doResetTitles()
  });
});
function doResetTitles(){
  STATE.titles = getDefaultTitles(STATE.lang);
  STATE.activeCat = 'air';
  saveState(); renderTitlesUI(); recalcAllPanels();
}

async function initApp(){
  applyTheme();
  applyFontScale();
  applyLang();

  const cached = loadRatesFromCache();
  if (cached){
    RATES.rates = cached.rates;
    RATES.lastUpdate = cached.lastUpdate;
    RATES.source = 'cached';
  } else {
    RATES.rates = { ...FALLBACK_RATES };
    RATES.source = 'fallback';
    RATES.lastUpdate = null;
  }
  updateRatesStatusUI();

  renderEverything();

  document.getElementById('ratesStatusText').textContent = t('ratesLoading');
  const ok = await fetchRatesFromInternet();
  if (ok){
    recalcAllPanels();
  } else if (!cached){
    RATES.source = 'error';
  }
  updateRatesStatusUI();
}

initApp();
</script>
