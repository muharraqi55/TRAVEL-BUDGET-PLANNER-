<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ترتيب ميزانية السفر</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
:root{--bg1:#1e293b;--bg2:#0b1220;--panel:#fff;--panel2:#f8fafc;--ink:#0f172a;--muted:#64748b;--line:#e5e9f0;--line2:#cbd5e1;--sky:#0ea5e9;--teal:#14b8a6;--amber:#f59e0b;--green:#16a34a;--red:#e11d48;--purple:#8b5cf6;--soft:#f8fafc;--input-bg:#fffdf5;--input-border:#cbd5e1;--input-border-hover:#94a3b8;--head-grad-1:#0f172a;--head-grad-2:#1e3a5f;--row-alt:#fff}
body.dark{--bg1:#0b1220;--bg2:#050810;--panel:#111827;--panel2:#0f172a;--ink:#e5e7eb;--muted:#94a3b8;--line:#1f2937;--line2:#334155;--soft:#0f172a;--input-bg:#1e293b;--input-border:#334155;--input-border-hover:#475569;--head-grad-1:#050810;--head-grad-2:#0f172a;--row-alt:#0f172a;--sky:#38bdf8;--teal:#2dd4bf;--amber:#fbbf24}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,var(--bg1),var(--bg2) 60%);color:var(--ink);min-height:100vh;padding:22px 16px 40px;font-size:calc(14px * var(--fs,1));transition:background .3s,color .3s}
.site-footer{max-width:1500px;margin:48px auto 0;padding:24px 20px;text-align:center;position:relative}
.site-footer::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#0ea5e9,#14b8a6,#8b5cf6,transparent);opacity:.7}
.footer-inner{display:inline-flex;flex-direction:column;align-items:center;gap:10px;padding:18px 40px;background:linear-gradient(135deg,rgba(15,23,42,.6),rgba(30,58,95,.5));border:1px solid rgba(255,255,255,.12);border-radius:20px;backdrop-filter:blur(12px);box-shadow:0 20px 45px rgba(2,6,23,.4);position:relative;overflow:hidden}
.footer-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#0ea5e9,#14b8a6 50%,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;box-shadow:0 10px 30px rgba(14,165,233,.45)}
.footer-name{font-size:26px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#7dd3fc 0%,#5eead4 35%,#a78bfa 70%,#f0abfc 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.footer-tagline{font-size:11.5px;color:#94a3b8;font-weight:600;letter-spacing:2.5px;text-transform:uppercase}
.footer-divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(148,163,184,.4),transparent);margin:6px 0 2px}
.footer-copy{font-size:11px;color:#64748b;font-weight:600;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.footer-copy .heart{color:#e11d48}
.footer-year{padding:1px 8px;background:rgba(255,255,255,.08);border-radius:6px;border:1px solid rgba(255,255,255,.1);font-weight:800;color:#cbd5e1;font-size:10.5px}
.page-head{max-width:1500px;margin:0 auto 14px;text-align:center;color:#e2e8f0}
.page-head h1{margin:0 0 4px;font-size:1.75em}
.page-head p{margin:0;color:#94a3b8;font-size:.95em}
.toolbar{max-width:1500px;margin:0 auto 18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;backdrop-filter:blur(8px)}
.tb-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#e2e8f0;font-family:inherit;font-weight:700;font-size:.85em;padding:7px 12px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap}
.tb-btn:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
.tb-btn.primary{background:linear-gradient(135deg,#0ea5e9,#14b8a6);border-color:transparent}
.tb-btn.rates-btn{background:linear-gradient(135deg,#8b5cf6,#6366f1);border-color:transparent}
.tb-btn.xlsx-export{background:linear-gradient(135deg,#16a34a,#15803d);border-color:transparent}
.tb-btn.xlsx-import{background:linear-gradient(135deg,#0d9488,#0891b2);border-color:transparent}
.tb-btn.help-btn{background:linear-gradient(135deg,#f59e0b,#f97316);border-color:transparent}
.tb-sep{width:1px;height:22px;background:rgba(255,255,255,.15);margin:0 4px}
.rates-status{font-size:.78em;color:#94a3b8;font-weight:600;display:flex;align-items:center;gap:6px}
.rates-status .dot{width:8px;height:8px;border-radius:50%;background:#64748b;display:inline-block}
.rates-status.ok .dot{background:#4ade80;box-shadow:0 0 8px #4ade80}
.titles-panel{max-width:1500px;margin:0 auto 18px;background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:0 20px 45px rgba(2,6,23,.45);border:1px solid rgba(255,255,255,.06)}
.titles-head{background:linear-gradient(135deg,var(--head-grad-1),var(--head-grad-2));color:#fff;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.titles-head h3{margin:0;font-size:1em;display:flex;align-items:center;gap:8px}
.titles-head .reset-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#cbd5e1;font-family:inherit;font-size:.8em;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600}
.tabs{display:flex;background:var(--soft);border-bottom:2px solid var(--line2);padding:0 10px;gap:4px;flex-wrap:wrap}
.tab{background:transparent;border:0;font-family:inherit;font-size:.9em;font-weight:700;color:var(--muted);padding:11px 15px;cursor:pointer;display:flex;align-items:center;gap:8px;position:relative;top:2px;border-radius:10px 10px 0 0}
.tab.active{background:var(--panel);color:var(--ink);box-shadow:0 -3px 0 0 var(--sky) inset}
.tab[data-cat="hotel"].active{box-shadow:0 -3px 0 0 var(--teal) inset}
.tab[data-cat="other"].active{box-shadow:0 -3px 0 0 var(--amber) inset}
.tab .count{background:var(--line);color:var(--muted);font-size:.75em;padding:1px 8px;border-radius:999px;font-weight:800;min-width:22px;text-align:center}
.tab.active .count{background:var(--sky);color:#fff}
.tab-body{padding:13px 18px 15px}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;min-height:36px;margin-bottom:12px}
.chip-list .empty{color:var(--muted);font-size:.9em;font-style:italic}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line2);color:var(--ink);font-size:.85em;font-weight:600;padding:5px 8px 5px 13px;border-radius:999px}
.chip.air{background:#e0f2fe;border-color:#7dd3fc;color:#0369a1}
.chip.hotel{background:#ccfbf1;border-color:#5eead4;color:#0f766e}
.chip.other{background:#fef3c7;border-color:#fcd34d;color:#92400e}
.chip button{background:transparent;border:0;color:inherit;cursor:pointer;font-size:1.1em;padding:0 3px;border-radius:50%;opacity:.6}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;border:1.5px solid var(--input-border);border-radius:9px;padding:8px 12px;font-family:inherit;font-size:.92em;background:var(--input-bg);color:var(--ink)}
.add-row input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.add-row button{background:linear-gradient(135deg,#0ea5e9,#14b8a6);border:0;color:#fff;font-family:inherit;font-weight:700;font-size:.92em;padding:9px 18px;border-radius:9px;cursor:pointer}
.panels{max-width:1500px;margin:0 auto;display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(560px,1fr))}
@media(max-width:640px){.panels{grid-template-columns:1fr}}
.panel{background:var(--panel);border-radius:16px;overflow:hidden;box-shadow:0 20px 45px rgba(2,6,23,.45);border:1px solid rgba(255,255,255,.06);position:relative}
.panel-head{background:linear-gradient(135deg,var(--head-grad-1),var(--head-grad-2));color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.panel-head h2{margin:0;font-size:1.05em;display:flex;align-items:center;gap:10px}
.badge{background:rgba(14,165,233,.25);border:1px solid rgba(14,165,233,.5);color:#7dd3fc;font-size:.75em;padding:3px 10px;border-radius:999px;font-weight:700}
.panel-remove{background:rgba(225,29,72,.2);border:1px solid rgba(225,29,72,.4);color:#fda4af;font-family:inherit;font-size:.8em;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer;margin-inline-start:auto}
.head-inputs{display:flex;gap:12px;flex-wrap:wrap}
.head-inputs label{display:flex;flex-direction:column;font-size:.72em;color:#94a3b8;gap:4px}
.head-inputs .inp{width:110px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:6px 9px;font-size:.95em;font-weight:700;font-family:inherit;text-align:center}
.head-inputs .inp:focus{outline:none;border-color:var(--sky);background:rgba(14,165,233,.18)}
.table-wrap{overflow-x:auto;padding:13px 14px 0}
table{width:100%;border-collapse:collapse;font-size:.9em;min-width:1280px}
thead th{background:var(--soft);color:var(--muted);font-weight:800;font-size:.76em;padding:8px 5px;border-bottom:1px solid var(--line2);text-align:center;white-space:nowrap}
thead th:nth-child(3){text-align:right}
thead th .th-sub{display:block;font-size:.85em;font-weight:600;color:#94a3b8;margin-top:1px}
thead th.th-cur-in{color:#0369a1}
thead th.th-cur-out{color:#7c3aed}
tbody td{border-bottom:1px solid var(--line);padding:4px;vertical-align:middle}
tbody tr{background:var(--row-alt)}
tbody tr.cat-air{background:rgba(14,165,233,.05)}
tbody tr.cat-hotel{background:rgba(20,184,166,.05)}
tbody tr.row-off{opacity:.55}
.empty-state{text-align:center;padding:30px 20px;color:var(--muted)}
.empty-state .icon{font-size:2.5em;opacity:.5}
.empty-state .txt{font-size:.95em;font-weight:600;color:var(--muted)}
.empty-state .sub{font-size:.82em}
.cell-inp{width:100%;border:1.5px solid var(--input-border);background:var(--input-bg);border-radius:8px;padding:7px 6px;font-family:inherit;font-size:.9em;color:var(--ink);box-shadow:inset 0 1px 2px rgba(15,23,42,.04)}
.cell-inp:focus{outline:none;border-color:var(--sky);background:var(--panel);box-shadow:0 0 0 3px rgba(14,165,233,.18)}
.cell-inp.n{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.cell-inp[type="number"]::-webkit-outer-spin-button,.cell-inp[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cell-inp[type="number"]{-moz-appearance:textfield}
@keyframes clampShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.clamp-shake{animation:clampShake .3s;border-color:var(--red) !important;background:rgba(225,29,72,.1) !important}
.date-wrap{position:relative;display:flex;align-items:center}
.date-wrap .cell-inp.date-txt{padding-inline-end:26px;text-align:center}
.cal-btn{position:absolute;inset-inline-end:2px;top:50%;transform:translateY(-50%);background:transparent;border:0;cursor:pointer;font-size:.95em;padding:5px 4px;border-radius:6px;color:var(--muted)}
.cal-native{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.toggle-cell{text-align:center}
.toggle-wrap{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.toggle-wrap input{position:absolute;opacity:0;width:0;height:0}
.toggle-track{width:36px;height:20px;background:#cbd5e1;border-radius:999px;position:relative;transition:background .2s;flex-shrink:0}
.toggle-track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.toggle-wrap input:checked + .toggle-track{background:linear-gradient(135deg,#16a34a,#14b8a6)}
.toggle-wrap input:checked + .toggle-track::after{left:18px}
.toggle-label{font-size:.68em;font-weight:800;color:#94a3b8;min-width:26px}
.currency-cell{text-align:center;padding:3px !important}
.currency-sel{width:100%;border:1.5px solid var(--input-border);background:var(--input-bg);border-radius:8px;padding:6px 2px;font-family:inherit;font-size:.78em;font-weight:800;text-align:center;color:var(--ink);cursor:pointer}
.currency-cell.cur-in .currency-sel{border-color:rgba(14,165,233,.4);background:rgba(14,165,233,.05)}
.currency-cell.cur-out .currency-sel{border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.05)}
.bhd-cell{text-align:center;font-weight:800;background:rgba(139,92,246,.08);border:1.5px dashed rgba(139,92,246,.35);border-radius:8px;padding:7px 4px;font-size:.82em;color:#7c3aed;white-space:nowrap}
.cell-total{text-align:center;font-weight:800;color:#047857;background:rgba(22,163,74,.08);border:1.5px dashed rgba(22,163,74,.35);border-radius:8px;padding:7px 5px;font-size:.9em;white-space:nowrap}
.del-btn{background:rgba(225,29,72,.08);border:1.5px solid rgba(225,29,72,.25);cursor:pointer;padding:6px;border-radius:8px;color:var(--red)}
.cat-cell{text-align:center;white-space:nowrap}
.cat-pill{display:inline-block;font-size:.68em;font-weight:800;padding:3px 7px;border-radius:999px;border:1.5px solid transparent}
.cat-pill.air{background:#e0f2fe;color:#0369a1;border-color:#7dd3fc}
.cat-pill.hotel{background:#ccfbf1;color:#0f766e;border-color:#5eead4}
.cat-pill.other{background:#fef3c7;color:#92400e;border-color:#fcd34d}
tfoot .row-grand td{background:linear-gradient(90deg,var(--head-grad-1),var(--head-grad-2));color:#fff;font-weight:800;font-size:.95em;border:0;padding:11px 8px}
tfoot .row-grand td.grand-label{color:#cbd5e1;padding-inline-start:14px;text-align:end}
.num{text-align:center;font-variant-numeric:tabular-nums}
.table-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:13px 16px 16px;background:var(--soft);border-top:1px dashed var(--line2);margin-top:13px}
.btn-add{background:linear-gradient(135deg,#16a34a,#14b8a6);border:0;color:#fff;font-family:inherit;font-weight:800;font-size:.9em;padding:9px 18px;border-radius:9px;cursor:pointer}
.btn-clear{background:transparent;border:1.5px solid rgba(225,29,72,.3);color:var(--red);font-family:inherit;font-weight:700;font-size:.88em;padding:9px 13px;border-radius:9px;cursor:pointer}
.btn-print{background:linear-gradient(135deg,#8b5cf6,#6366f1);border:0;color:#fff;font-family:inherit;font-weight:800;font-size:.88em;padding:9px 16px;border-radius:9px;cursor:pointer}
.btn-share{background:linear-gradient(135deg,#f59e0b,#f97316);border:0;color:#fff;font-family:inherit;font-weight:800;font-size:.88em;padding:9px 16px;border-radius:9px;cursor:pointer}
.btn-xlsx{background:linear-gradient(135deg,#16a34a,#15803d);border:0;color:#fff;font-family:inherit;font-weight:800;font-size:.88em;padding:9px 16px;border-radius:9px;cursor:pointer}
.table-actions .info{margin-inline-start:auto;font-size:.82em;color:var(--muted)}
.table-actions .info b{color:var(--ink)}
.table-actions .info .off-badge{display:inline-block;background:var(--line);color:var(--muted);font-size:.85em;font-weight:800;padding:2px 8px;border-radius:999px;margin-inline-start:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;padding:15px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.stat .s-label{font-size:.8em;color:var(--muted);font-weight:700;line-height:1.3}
.stat .s-value{font-size:1.3em;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.stat .cur{font-size:.62em;font-weight:700;opacity:.65}
.stat.hi{background:linear-gradient(180deg,rgba(22,163,74,.12),rgba(22,163,74,.05));border-color:rgba(22,163,74,.3)}
.stat.hi .s-value{color:#047857}
.stat.warn{background:linear-gradient(180deg,rgba(245,158,11,.12),rgba(245,158,11,.04));border-color:rgba(245,158,11,.3)}
.stat.warn .s-value{color:#b45309}
.stat.bad{background:linear-gradient(180deg,rgba(225,29,72,.1),rgba(225,29,72,.04));border-color:rgba(225,29,72,.3)}
.stat.bad .s-value{color:var(--red)}
.stat.purple{background:linear-gradient(180deg,rgba(139,92,246,.12),rgba(139,92,246,.04));border-color:rgba(139,92,246,.3)}
.stat.purple .s-value{color:#7c3aed}
.totals-row{display:grid;gap:12px;padding:0 15px 15px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.currencies-card{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.currencies-card.in-card{border-color:rgba(14,165,233,.35)}
.currencies-card.out-card{border-color:rgba(139,92,246,.35)}
.currencies-card .cc-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.currencies-card .cc-title{font-size:.9em;font-weight:800;color:var(--ink)}
.currencies-card .cc-update{font-size:.75em;color:var(--muted);font-weight:600}
.currencies-list{display:flex;flex-direction:column;gap:7px}
.currency-item{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:.85em;flex-wrap:wrap}
.currency-item .ci-left{display:flex;align-items:center;gap:9px;font-weight:800;color:var(--ink)}
.currency-item .ci-code{color:#fff;padding:3px 9px;border-radius:7px;font-size:.8em;letter-spacing:.5px}
.ci-code.in-code{background:linear-gradient(135deg,#0ea5e9,#14b8a6)}
.ci-code.out-code{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.currency-item .ci-name{color:var(--muted);font-weight:600;font-size:.88em}
.currency-item .ci-right{display:flex;align-items:center;gap:9px;font-variant-numeric:tabular-nums}
.currency-item .ci-sub{font-weight:800;font-size:.95em}
.ci-sub.in-sub{color:#0369a1}
.ci-sub.out-sub{color:#7c3aed}
.currency-item .ci-bhd{font-weight:800;color:#047857;font-size:.95em}
.currency-item .ci-arrow{color:var(--muted)}
.currencies-empty{text-align:center;color:var(--muted);font-size:.85em;padding:10px;font-style:italic}
.perday-row{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(245,158,11,.4);flex-wrap:wrap}
.perday-row label{font-size:.72em;font-weight:800;color:#92400e;white-space:nowrap}
.perday-inp{width:56px;border:1.5px solid #fcd34d;background:var(--input-bg);border-radius:6px;padding:4px 6px;font-family:inherit;font-size:.85em;font-weight:800;color:#78350f;text-align:center}
.perday-reset{background:transparent;border:0;cursor:pointer;font-size:.78em;color:#a16207;padding:2px 5px;border-radius:5px;font-family:inherit;font-weight:800}
.add-plan-wrap{max-width:1500px;margin:18px auto 0;display:flex;justify-content:center}
.btn-add-plan{background:linear-gradient(135deg,#0ea5e9,#14b8a6);border:0;color:#fff;font-family:inherit;font-weight:800;font-size:.95em;padding:12px 26px;border-radius:12px;cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.modal{background:var(--panel);border-radius:16px;padding:22px 24px;max-width:440px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.5)}
.modal h3{margin:0 0 10px;font-size:1.1em;color:var(--ink)}
.modal p{margin:0 0 20px;font-size:.92em;color:var(--muted);line-height:1.6}
.modal-actions{display:flex;flex-direction:column;gap:8px}
.modal-actions button{font-family:inherit;font-weight:800;font-size:.92em;padding:11px 16px;border-radius:9px;cursor:pointer;border:0}
.modal-actions .m-save{background:linear-gradient(135deg,#0ea5e9,#14b8a6);color:#fff}
.modal-actions .m-confirm{background:rgba(225,29,72,.12);color:var(--red);border:1.5px solid rgba(225,29,72,.3)}
.modal-actions .m-cancel{background:var(--soft);color:var(--muted);border:1.5px solid var(--line2)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:linear-gradient(135deg,#16a34a,#14b8a6);color:#fff;font-weight:700;font-size:.9em;padding:11px 22px;border-radius:999px;box-shadow:0 12px 30px rgba(22,163,74,.4);transition:transform .3s;z-index:10000;pointer-events:none;display:flex;align-items:center;gap:8px}

function importFromExcel(file){
  if(typeof XLSX==='undefined'){showToast('Excel غير محمّل',true);return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const sheetNames=wb.SheetNames.filter(n=>n!=='ملخص'&&n!=='Summary');
      if(!sheetNames.length){showToast(t('excelNoSheets'),true);return;}
      const newPanels=[];
      sheetNames.forEach((sheetName,pIdx)=>{
        const ws=wb.Sheets[sheetName];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        let days=14,budget=0,headerRowIdx=-1;
        for(let r=0;r<Math.min(rows.length,10);r++){const firstCell=String(rows[r][0]||'').trim();if(/تفعيل|Active|نشط/i.test(firstCell)){headerRowIdx=r;break;}}
        rows.slice(0,headerRowIdx>0?headerRowIdx:5).forEach(row=>{row.forEach((cell,ci)=>{const s=String(cell||'').trim();if(/عدد الأيام الكلي|Total Days/i.test(s)){const v=parseFloat(row[ci+1]);if(isFinite(v)&&v>0)days=v;}if(/الميزانية|Budget/i.test(s)){const v=parseFloat(row[ci+1]);if(isFinite(v))budget=v;}});});
        const panelRows=[];
        if(headerRowIdx>=0){
          for(let r=headerRowIdx+1;r<rows.length;r++){
            const row=rows[r];if(!row||row.length<3)continue;
            const firstCell=String(row[0]||'').trim();
            if(/الإجمالي الكلي|Grand Total|المتبقي|Remaining/i.test(firstCell))break;
            const title=String(row[2]||'').trim();
            const price=parseFloat(row[4]);const dd=parseFloat(row[8]);
            if(!title&&!isFinite(price)&&!isFinite(dd))continue;
            const activeCell=String(row[0]||'').trim().toLowerCase();
            const ok=!/^(لا|no|false|0)$/i.test(activeCell);
            let curIn=String(row[5]||'').trim().toUpperCase();let curOut=String(row[7]||'').trim().toUpperCase();
            if(!CURRENCIES[curIn])curIn='BHD';if(!CURRENCIES[curOut])curOut='BHD';
            panelRows.push({ok,date:String(row[1]||'').trim(),title,currency:curIn,currency2:curOut,price:isFinite(price)?price:null,days:isFinite(dd)?dd:null});
          }
        }
        newPanels.push({id:'plan_'+Date.now()+'_'+pIdx+'_'+Math.random().toString(36).slice(2,6),index:pIdx,days,budget,perdayDays:null,rows:panelRows});
      });
      if(!newPanels.length){showToast(t('excelImportError'),true);return;}
      STATE.panels=newPanels;saveState();renderEverything();showToast(t('excelImportSuccess'));
    }catch(err){console.error(err);showToast(t('excelImportError'),true);}
  };
  reader.onerror=()=>showToast(t('excelImportError'),true);
  reader.readAsArrayBuffer(file);
}

function renderTitlesUI(){
  const tabsEl=document.getElementById('tabs');const chipListEl=document.getElementById('chipList');const datalist=document.getElementById('titlesList');
  const labels={air:t('tabAir'),hotel:t('tabHotel'),other:t('tabOther')};const cats=['air','hotel','other'];
  tabsEl.innerHTML=cats.map(c=>`<button class="tab ${c===STATE.activeCat?'active':''}" data-cat="${c}" type="button">${labels[c]} <span class="count">${STATE.titles[c].length}</span></button>`).join('');
  const all=[];cats.forEach(c=>STATE.titles[c].forEach(x=>{if(!all.some(y=>y.toLowerCase()===x.toLowerCase()))all.push(x);}));
  datalist.innerHTML=all.map(x=>`<option value="${esc(x)}"></option>`).join('');
  const list=STATE.titles[STATE.activeCat];
  if(!list.length){chipListEl.innerHTML=`<div class="empty">${t('planEmptyMsg')} «${labels[STATE.activeCat]}»</div>`;}

  document.getElementById('newTitleInput').placeholder=t('addTitleTo')+' «'+labels[STATE.activeCat]+'»…';
}

function addTitle(v){v=String(v||'').trim();if(!v)return;['air','hotel','other'].forEach(c=>{STATE.titles[c]=STATE.titles[c].filter(x=>x.toLowerCase()!==v.toLowerCase());});STATE.titles[STATE.activeCat].push(v);saveState();renderTitlesUI();recalcAllPanels();}
document.getElementById('addBtn').addEventListener('click',()=>{const inp=document.getElementById('newTitleInput');addTitle(inp.value);inp.value='';inp.focus();});
document.getElementById('newTitleInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTitle(e.target.value);e.target.value='';}});
function buildCurrencyOptions(selected){return Object.entries(CURRENCIES).map(([code,c])=>{const label=STATE.lang==='ar'?`${code} — ${c.ar}`:`${code} — ${c.en}`;return `<option value="${code}" ${code===selected?'selected':''}>${esc(label)}</option>`;}).join('');}
function enforceMax(inp,getMax){
  const clamp=()=>{const maxV=parseFloat(getMax())||0;const v=parseFloat(inp.value);if(isFinite(v)&&maxV>0&&v>maxV){inp.value=maxV;inp.classList.add('clamp-shake');setTimeout(()=>inp.classList.remove('clamp-shake'),400);return true;}if(isFinite(v)&&v<0)inp.value=0;return false;};
  inp.addEventListener('beforeinput',e=>{if(e.data&&/[0-9]/.test(e.data)){const cur=inp.value||'';const future=cur+e.data;const maxV=parseFloat(getMax())||0;const fv=parseFloat(future);if(isFinite(fv)&&maxV>0&&fv>maxV){e.preventDefault();inp.classList.add('clamp-shake');setTimeout(()=>inp.classList.remove('clamp-shake'),400);}}});
  inp.addEventListener('input',clamp);inp.addEventListener('change',clamp);inp.addEventListener('blur',clamp);inp.addEventListener('paste',()=>setTimeout(clamp,0));
}

function makeRowEl(row,maxDays){
  row=row||{ok:true,date:'',title:'',price:null,days:null,currency:'BHD',currency2:'BHD'};
  const isOn=row.ok!==false;const curIn=row.currency||'BHD';const curOut=row.currency2||'BHD';
  const tr=document.createElement('tr');
  tr.innerHTML=`
    <td class="toggle-cell"><label class="toggle-wrap" title="${t('thToggle')}"><input type="checkbox" class="ok-inp" ${isOn?'checked':''}><span class="toggle-track"></span><span class="toggle-label">${isOn?'✔':'—'}</span></label></td>
    <td><div class="date-wrap"><input type="text" class="cell-inp date-txt" data-f="date" value="${esc(row.date??'')}" placeholder="—"><button type="button" class="cal-btn" aria-label="cal">📅</button><input type="date" class="cal-native" tabindex="-1" aria-hidden="true"></div></td>
    <td><input type="text" class="cell-inp title-inp" data-f="title" list="titlesList" autocomplete="off" value="${esc(row.title??'')}" placeholder="…"></td>
    <td class="cat-cell"><span class="cat-pill">—</span></td>
    <td><input type="number" min="0" step="0.01" class="cell-inp n" data-f="price" value="${row.price??''}" placeholder="0.00"></td>
    <td class="currency-cell cur-in"><select class="currency-sel" data-f="currency" title="${t('currencyInTitle')}">${buildCurrencyOptions(curIn)}</select></td>
    <td class="bhd-cell" data-k="equiv">0.00</td>
    <td class="currency-cell cur-out"><select class="currency-sel" data-f="currency2" title="${t('currencyOutTitle')}">${buildCurrencyOptions(curOut)}</select></td>
    <td><input type="number" min="0" max="${maxDays||''}" step="1" class="cell-inp n" data-f="days" value="${row.days??''}" placeholder="0"></td>
    <td class="cell-total" data-k="lineBHD">0.00 د.ب</td>
    <td style="text-align:center"><button type="button" class="del-btn" title="${t('thDelete')}">🗑️</button></td>
  `;
  const wrap=tr.querySelector('.date-wrap');const calBtn=wrap.querySelector('.cal-btn');const native=wrap.querySelector('.cal-native');const txt=wrap.querySelector('.date-txt');
  calBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const pre=parseDateForPicker(txt.value);if(pre)native.value=pre;try{if(typeof native.showPicker==='function')native.showPicker();else{native.style.pointerEvents='auto';native.focus();native.click();native.style.pointerEvents='none';}}catch(err){native.style.pointerEvents='auto';native.focus();native.click();native.style.pointerEvents='none';}});
  native.addEventListener('change',()=>{if(!native.value)return;txt.value=formatDateFromPicker(native.value);txt.dispatchEvent(new Event('input',{bubbles:true}));});
  const daysInp=tr.querySelector('[data-f="days"]');enforceMax(daysInp,()=>daysInp.max);
  const okInp=tr.querySelector('.ok-inp');const okLbl=tr.querySelector('.toggle-label');
  okInp.addEventListener('change',()=>{okLbl.textContent=okInp.checked?'✔':'—';});
  tr.dataset.active=isOn?'1':'0';if(!isOn)tr.classList.add('row-off');
  return tr;
}

function doClearRows(tbody,sec,panel){Array.from(tbody.children).forEach((tr,i)=>{setTimeout(()=>{tr.classList.add('row-removing');setTimeout(()=>{tr.remove();syncPanelToState(sec);recalcPanel(panel,sec);saveState();},260);},i*25);});}
function doRemovePlan(pid){STATE.panels=STATE.panels.filter(p=>p.id!==pid);saveState();renderPanels();}
function syncPanelToState(sec){
  const pid=sec.dataset.pid;const panel=STATE.panels.find(p=>p.id===pid);if(!panel)return;
  panel.days=parseFloat(sec.querySelector('.days-inp').value)||0;
  panel.budget=parseFloat(sec.querySelector('.budget-inp').value)||0;
  const perdayInp=sec.querySelector('.perday-inp');
  panel.perdayDays=perdayInp.dataset.userEdited?(parseFloat(perdayInp.value)||panel.days):null;
  panel.rows=[];
  sec.querySelectorAll('tbody tr').forEach(tr=>{
    const pv=tr.querySelector('[data-f="price"]').value;const dv=tr.querySelector('[data-f="days"]').value;
    const curSel=tr.querySelector('[data-f="currency"]');const cur2Sel=tr.querySelector('[data-f="currency2"]');
    panel.rows.push({ok:tr.querySelector('.ok-inp').checked,date:tr.querySelector('[data-f="date"]').value,title:tr.querySelector('[data-f="title"]').value,currency:curSel?curSel.value:'BHD',currency2:cur2Sel?cur2Sel.value:'BHD',price:pv===''?null:(parseFloat(pv)||0),days:dv===''?null:(parseFloat(dv)||0)});
  });
}
function syncFromDOM(){document.querySelectorAll('.panel').forEach(panelEl=>syncPanelToState(panelEl));}
function setStat(sec,key,val,{bad=false}={}){const el=sec.querySelector(`[data-k="${key}"]`);if(!el)return;el.textContent=fmt(val);const card=el.closest('.stat');if(card)card.classList.toggle('bad',bad&&val<0);}
function renderInCurrenciesCard(sec,totals){const listEl=sec.querySelector('[data-k="ccListIn"]');const updEl=sec.querySelector('[data-k="ccUpdate"]');if(!listEl)return;if(updEl){if(RATES.lastUpdate){const d=new Date(RATES.lastUpdate);if(!isNaN(d.getTime()))updEl.textContent=t('currenciesCardUpdate')+' '+d.toLocaleString(STATE.lang==='ar'?'ar-BH':'en-GB',{dateStyle:'short',timeStyle:'short'});else updEl.textContent=t('currenciesCardUpdate')+' '+RATES.lastUpdate;}else updEl.textContent='';}const codes=Object.keys(totals).sort((a,b)=>totals[b].foreign-totals[a].foreign);if(!codes.length){listEl.innerHTML=`<div class="currencies-empty">${t('currenciesCardEmpty')}</div>`;return;}listEl.innerHTML=codes.map(code=>{const c=CURRENCIES[code];const sym=c?c.sym:code;const name=curName(code);const foreign=totals[code].foreign;const bhd=totals[code].bhd;return `<div class="currency-item"><div class="ci-left"><span class="ci-code in-code">${esc(code)}</span><span class="ci-name">${esc(name)}</span></div><div class="ci-right"><span class="ci-sub in-sub">${fmt(foreign)} ${esc(sym)}</span><span class="ci-arrow">→</span><span class="ci-bhd">${fmt(bhd)} ${curSym('BHD')}</span></div></div>`;}).join('');}
function renderOutCurrenciesCard(sec,totals){const listEl=sec.querySelector('[data-k="ccListOut"]');if(!listEl)return;const codes=Object.keys(totals).sort((a,b)=>totals[b].foreign-totals[a].foreign);if(!codes.length){listEl.innerHTML=`<div class="currencies-empty">${t('currenciesCardEmpty')}</div>`;return;}listEl.innerHTML=codes.map(code=>{const c=CURRENCIES[code];const sym=c?c.sym:code;const name=curName(code);const foreign=totals[code].foreign;const bhd=totals[code].bhd;return `<div class="currency-item"><div class="ci-left"><span class="ci-code out-code">${esc(code)}</span><span class="ci-name">${esc(name)}</span></div><div class="ci-right"><span class="ci-sub out-sub">${fmt(foreign)} ${esc(sym)}</span><span class="ci-arrow">→</span><span class="ci-bhd">${fmt(bhd)} ${curSym('BHD')}</span></div></div>`;}).join('');}

function recalcPanel(panel,sec){
  const days=parseFloat(sec.querySelector('.days-inp').value)||0;
  const budget=parseFloat(sec.querySelector('.budget-inp').value)||0;
  sec.querySelector('.badge').textContent=days;
  const perdayInp=sec.querySelector('.perday-inp');let perdayDays=parseFloat(perdayInp.value);if(!isFinite(perdayDays)||perdayDays<=0)perdayDays=days;
  let sumTotalBHD=0,airSum=0,hotelSum=0,otherSum=0;let rowCount=0,offCount=0;
  const totalsIn={};const totalsOut={};
  sec.querySelectorAll('tbody tr').forEach(tr=>{
    rowCount++;
    const okInp=tr.querySelector('.ok-inp');const isOn=okInp?okInp.checked:true;
    tr.classList.toggle('row-off',!isOn);
    if(!isOn)offCount++;
    const titleEl=tr.querySelector('[data-f="title"]');const title=titleEl?titleEl.value:'';
    const cat=categoryOf(title);
    tr.classList.remove('cat-air','cat-hotel','cat-other');tr.classList.add('cat-'+cat);
    const pill=tr.querySelector('.cat-pill');
    if(pill){pill.className='cat-pill '+cat;const icons={air:'✈️',hotel:'🏨',other:'📦'};const labels={air:t('catAir'),hotel:t('catHotel'),other:t('catOther')};pill.textContent=icons[cat]+' '+labels[cat];}
    const curInSel=tr.querySelector('[data-f="currency"]');const curOutSel=tr.querySelector('[data-f="currency2"]');
    const curIn=curInSel?curInSel.value:'BHD';const curOut=curOutSel?curOutSel.value:'BHD';
    const priceIn=parseFloat(tr.querySelector('[data-f="price"]').value)||0;
    const d=parseFloat(tr.querySelector('[data-f="days"]').value)||0;
    const equiv=convert(priceIn,curIn,curOut);
    const equivEl=tr.querySelector('[data-k="equiv"]');if(equivEl){equivEl.textContent=t('approx')+' '+fmt(equiv)+' '+curSym(curOut);}
    const priceInBHD=toBHD(priceIn,curIn);const lineBHD=priceInBHD*d;
    const totEl=tr.querySelector('[data-k="lineBHD"]');if(totEl){totEl.textContent=fmt(lineBHD)+' '+curSym('BHD');}
    if(!isOn)return;
    sumTotalBHD+=lineBHD;if(cat==='air')airSum+=lineBHD;if(cat==='hotel')hotelSum+=lineBHD;if(cat==='other')otherSum+=lineBHD;
    const lineIn=priceIn*d;if(!totalsIn[curIn])totalsIn[curIn]={foreign:0,bhd:0};totalsIn[curIn].foreign+=lineIn;totalsIn[curIn].bhd+=lineBHD;
    const lineOut=equiv*d;if(!totalsOut[curOut])totalsOut[curOut]={foreign:0,bhd:0};totalsOut[curOut].foreign+=lineOut;totalsOut[curOut].bhd+=lineBHD;
  });
  const airHotel=airSum+hotelSum;const hand=budget-sumTotalBHD;const perDay=perdayDays>0?hand/perdayDays:0;
  const tfTot=sec.querySelector('.tf-total');if(tfTot)tfTot.textContent=fmt(sumTotalBHD)+' '+curSym('BHD');
  sec.querySelector('.row-count').textContent=rowCount;
  const offBadge=sec.querySelector('.off-badge');if(offBadge){offBadge.style.display=offCount>0?'inline-block':'none';offBadge.textContent=offCount+' '+t('offBadge');}
  const emptyState=sec.querySelector('.empty-state');if(emptyState)emptyState.style.display=(rowCount===0)?'block':'none';
  setStat(sec,'budget',budget);setStat(sec,'airOnly',airSum);setStat(sec,'hotelOnly',hotelSum);setStat(sec,'airHotel',airHotel);setStat(sec,'otherOnly',otherSum);setStat(sec,'hand',hand,{bad:true});setStat(sec,'perDay',perDay,{bad:true});
  renderInCurrenciesCard(sec,totalsIn);renderOutCurrenciesCard(sec,totalsOut);
  const zone=sec.querySelector('.pdf-header-zone');
  if(zone){
    const kpis=zone.querySelectorAll('.pdf-kpi .kpi-value');
    if(kpis.length>=4){
      kpis[0].innerHTML=fmt(airSum)+'<span class="kpi-cur">'+t('currency')+'</span>';
      kpis[1].innerHTML=fmt(hotelSum)+'<span class="kpi-cur">'+t('currency')+'</span>';
      kpis[2].innerHTML=fmt(hand)+'<span class="kpi-cur">'+t('currency')+'</span>';
      kpis[3].innerHTML=fmt(otherSum)+'<span class="kpi-cur">'+t('currency')+'</span>';
    }
    const stripBadges=zone.querySelectorAll('.ps-badge');
    if(stripBadges.length>=2){
      stripBadges[0].textContent='📅 '+days+' '+(STATE.lang==='ar'?'يوم':'days');
      stripBadges[1].textContent='💰 '+fmt(budget)+' '+t('currency');
    }
  }
}

function recalcAllPanels(){document.querySelectorAll('.panel').forEach(sec=>{const panel=STATE.panels.find(p=>p.id===sec.dataset.pid);if(panel)recalcPanel(panel,sec);});}
function renderPanels(){const container=document.getElementById('panels');container.innerHTML='';STATE.panels.forEach((p,i)=>container.appendChild(buildPanelEl(p,i)));document.getElementById('addPlanWrap').style.display='flex';}
function renderEverything(){renderTitlesUI();renderPanels();}
function printPlan(panelEl){document.querySelectorAll('.panel.print-target').forEach(p=>p.classList.remove('print-target'));document.body.classList.add('printing');panelEl.classList.add('print-target');window.print();}
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');document.querySelectorAll('.panel.print-target').forEach(p=>p.classList.remove('print-target'));});

async function sharePlanPDF(panelEl,label,idx){
  if(typeof html2pdf==='undefined'){showToast(t('importError'),true);return;}
  showToast(t('generating'));
  const clone=panelEl.cloneNode(true);
  clone.querySelectorAll('.table-actions, .panel-remove, .cal-btn, .del-btn, .perday-reset').forEach(el=>el.remove());
  clone.querySelectorAll('input').forEach(inp=>{
    const span=document.createElement('span');
    if(inp.type==='checkbox') span.textContent=inp.checked?'✔':'—';
    else span.textContent=inp.value||'—';
    inp.parentNode.replaceChild(span,inp);
  });
  clone.querySelectorAll('select').forEach(sel=>{
    const span = document.createElement('span');
    const code = sel.value || 'BHD';
    const cur  = CURRENCIES[code];
    const isIn = sel.dataset.f === 'currency';
    const bg   = isIn ? '#0ea5e9' : '#8b5cf6';
    span.textContent = code + (cur ? '  ' + cur.sym : '');
    span.setAttribute('style',
      'display:inline-block;' +
      'padding:3px 8px;' +
      'border-radius:5px;' +
      'font-size:9px;' +
      'font-weight:900;' +
      'color:#ffffff;' +
      'letter-spacing:.3px;' +
      'white-space:nowrap;' +
      'background:' + bg + ';' +
      'text-align:center;' +
      'min-width:56px;'
    );
    sel.parentNode.replaceChild(span, sel);
  });
  clone.querySelectorAll('button').forEach(b=>b.remove());
  clone.classList.add('print-target');
  const wrap = document.createElement('div');
  wrap.style.cssText='position:fixed;top:0;left:0;width:1120px;background:#ffffff;z-index:99999;pointer-events:none;opacity:0;';
  wrap.appendChild(clone);
  document.body.appendChild(wrap);
  await new Promise(r=>requestAnimationFrame(()=>setTimeout(r,150)));
  const opt={
    margin:[5,5,5,5],
    filename:(label||'plan').replace(/\s+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.pdf',
    image:{type:'jpeg',quality:0.98},
    html2canvas:{
      scale:2,
      backgroundColor:'#ffffff',
      useCORS:true,
      logging:false,
      windowWidth:1120,
      width:1120,
      onclone:(doc)=>{const el=doc.querySelector('.print-target');if(el){el.style.opacity='1';el.style.width='1120px';}}
    },
    jsPDF:{unit:'mm',format:'a4',orientation:'landscape'}
  };
  try{
    const blob=await html2pdf().set(opt).from(clone).outputPdf('blob');
    if(wrap.parentNode)document.body.removeChild(wrap);
    const file=new File([blob],opt.filename,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:label||'Travel Budget',text:label||''});showToast(t('shareSuccess'));}
      catch(err){if(err&&err.name==='AbortError')showToast(t('shareCancelled'),true);else{downloadBlob(blob,opt.filename);showToast(t('shareFallback'));}}
    }else{downloadBlob(blob,opt.filename);showToast(t('shareFallback'));}
  }catch(err){console.error(err);if(wrap.parentNode)document.body.removeChild(wrap);showToast(t('importError'),true);}
}
function downloadBlob(blob,filename){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);}

document.getElementById('btnLang').addEventListener('click',()=>{syncFromDOM();STATE.lang=STATE.lang==='ar'?'en':'ar';retranslateAll(STATE.lang);saveState();applyLang();renderEverything();});
document.getElementById('btnFontDec').addEventListener('click',()=>{STATE.fontScale=Math.max(0.8,+(STATE.fontScale-0.1).toFixed(2));applyFontScale();saveState();});
document.getElementById('btnFontInc').addEventListener('click',()=>{STATE.fontScale=Math.min(1.5,+(STATE.fontScale+0.1).toFixed(2));applyFontScale();saveState();});
document.getElementById('btnTheme').addEventListener('click',()=>{STATE.theme=STATE.theme==='dark'?'light':'dark';applyTheme();saveState();});
document.getElementById('btnSave').addEventListener('click',()=>{syncFromDOM();persistAndToast();});
document.getElementById('btnExport').addEventListener('click',()=>exportData());
document.getElementById('btnImport').addEventListener('click',()=>{document.getElementById('importFile').click();});
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)importData(f);e.target.value='';});
document.getElementById('btnExportXlsx').addEventListener('click',()=>exportToExcel());
document.getElementById('btnImportXlsx').addEventListener('click',()=>{document.getElementById('importXlsxFile').click();});
document.getElementById('importXlsxFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFromExcel(f);e.target.value='';});
document.getElementById('btnRefreshRates').addEventListener('click',async()=>{const btn=document.getElementById('btnRefreshRates');const statusTxt=document.getElementById('ratesStatusText');btn.disabled=true;statusTxt.textContent=t('ratesLoading');const ok=await fetchRatesFromInternet();btn.disabled=false;if(ok){showToast(t('ratesUpdated'));recalcAllPanels();}else{showToast(t('ratesFailed'),true);}updateRatesStatusUI();});
document.getElementById('btnAddPlan').addEventListener('click',()=>{syncFromDOM();STATE.panels.push(createDefaultPanel(STATE.panels.length));saveState();renderPanels();setTimeout(()=>{const panels=document.querySelectorAll('.panel');panels[panels.length-1].scrollIntoView({behavior:'smooth',block:'center'});},100);});
document.getElementById('resetTitles').addEventListener('click',()=>{showModal({title:t('resetConfirmTitle'),message:t('resetConfirmMsg'),onSave:()=>{exportData();setTimeout(()=>doResetTitles(),400);},onConfirm:()=>doResetTitles()});});
function doResetTitles(){STATE.titles=getDefaultTitles(STATE.lang);STATE.activeCat='air';saveState();renderTitlesUI();recalcAllPanels();}

async function initApp(){
  applyTheme();applyFontScale();applyLang();
  const cached=loadRatesFromCache();
  if(cached){RATES.rates=cached.rates;RATES.lastUpdate=cached.lastUpdate;RATES.source='cached';}
  else{RATES.rates={...FALLBACK_RATES};RATES.source='fallback';RATES.lastUpdate=null;}
  updateRatesStatusUI();renderEverything();
  document.getElementById('ratesStatusText').textContent=t('ratesLoading');
  const ok=await fetchRatesFromInternet();
  if(ok){recalcAllPanels();}else if(!cached){RATES.source='error';}
  updateRatesStatusUI();
}
initApp();
</script>
